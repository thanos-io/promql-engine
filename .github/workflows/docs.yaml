name: docs

on:
  push:
    branches:
      - main
    tags:
      - '*'
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    name:  Documentation check
    env:
      GOBIN: /tmp/.bin
    steps:
      - name: Checkout code into the Go module directory.
        uses: actions/checkout@v4

      - name: Install Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod

      - name: Check docs
        run: |
          if make check-docs > /tmp/check-docs.log 2>&1; then
            cat /tmp/check-docs.log
          else
            status=$?
            cat /tmp/check-docs.log
            details="$(tail -c 12000 /tmp/check-docs.log)"
            details="${details//'%'/'%25'}"
            details="${details//$'\r'/'%0D'}"
            details="${details//$'\n'/'%0A'}"
            echo "::error title=Documentation check failed::$details"
            exit "$status"
          fi
